<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | KRAYVO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    /* Same minimal style */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --primary: #6366f1; --primary-dark: #4f46e5; --bg: #f8fafc; --card: #ffffff;
      --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --danger: #ef4444;
    }
    [data-theme="dark"] {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text-muted: #94a3b8; --border: #334155;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; }
    .cart-item { background: var(--card); border-radius: 16px; padding: 16px; border: 1px solid var(--border); margin-bottom: 12px; display: flex; align-items: center; gap: 16px; }
    .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; background: #1e293b; }
    .cart-details { flex:1; }
    .cart-price { font-weight: 700; }
    .remove-btn { background: var(--danger); color: white; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; }
    .summary { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid var(--border); margin-top: 24px; }
    .checkout-btn { background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: 40px; font-weight: 700; width: 100%; cursor: pointer; font-size: 1rem; }
    .empty { text-align: center; padding: 50px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Continue Shopping</a>
    <h1 style="margin-bottom:20px;">🛒 Your Cart</h1>
    <div id="cartContainer">Loading cart...</div>
    <div id="cartSummary" class="summary hidden">
      <h3>Order Summary</h3>
      <p>Total: ₹<span id="totalAmount">0</span></p>
      <button class="checkout-btn" onclick="checkout()">Proceed to Pay</button>
    </div>
  </div>
  <script>
    const DEMO_PRODUCTS = (()=>{
      const platforms = ['krayvo','amazon','flipkart','myntra','savana','ajio','meesho'];
      const categories = ["Mobile","Fashion","Beauty","Electronics","Home & Kitchen","Accessories","Books"];
      const brands = {krayvo:'KRAYVO',amazon:'AmazonBasics',flipkart:'Flipkart SmartBuy',myntra:'Myntra',savana:'Savana',ajio:'Ajio',meesho:'Meesho'};
      const arr=[];
      for(const p of platforms){for(let i=1;i<=20;i++){const c=categories[i%categories.length];const pr=Math.floor(Math.random()*5000)+299;const op=pr+Math.floor(Math.random()*3000)+200;arr.push({id:`demo_${p}_${i}`,name:`${brands[p]} ${c} ${i}`,brand:brands[p],price:pr,originalPrice:op,category:c,platform:p,imageUrl:null});}}return arr;})();
    function getProductImage(p){if(p.imageData)return p.imageData;if(p.imageUrl)return p.imageUrl;return `https://placehold.co/80x80/1e293b/white?text=📦`;}
    
    let cart = JSON.parse(localStorage.getItem('krayvo_cart')) || [];
    function renderCart() {
      const container = document.getElementById('cartContainer');
      const summary = document.getElementById('cartSummary');
      if(cart.length === 0) {
        container.innerHTML = '<div class="empty">Your cart is empty.</div>';
        summary.classList.add('hidden');
        return;
      }
      let total = 0;
      container.innerHTML = cart.map(item => {
        const prod = DEMO_PRODUCTS.find(p => p.id === item.id);
        if(!prod) return '';
        total += prod.price * item.qty;
        return `<div class="cart-item">
          <img src="${getProductImage(prod)}" alt="">
          <div class="cart-details">
            <h4>${prod.name}</h4>
            <p>Qty: ${item.qty} × ₹${prod.price}</p>
          </div>
          <div class="cart-price">₹${prod.price * item.qty}</div>
          <button class="remove-btn" onclick="removeItem('${item.id}')">Remove</button>
        </div>`;
      }).join('');
      document.getElementById('totalAmount').innerText = total;
      summary.classList.remove('hidden');
    }
    window.removeItem = (pid) => {
      cart = cart.filter(i => i.id !== pid);
      localStorage.setItem('krayvo_cart', JSON.stringify(cart));
      renderCart();
    };
    window.checkout = () => {
      const krayvoItems = cart.filter(item => {
        const prod = DEMO_PRODUCTS.find(p => p.id === item.id);
        return prod && (prod.platform === 'krayvo' || !prod.platform);
      });
      if(krayvoItems.length === 0) {
        alert('Only KRAYVO branded products can be checked out here. Other items redirect to their store.');
        return;
      }
      let totalAmount = 0;
      krayvoItems.forEach(item => {
        const prod = DEMO_PRODUCTS.find(p => p.id === item.id);
        if(prod) totalAmount += prod.price * item.qty;
      });
      const options = {
        key: "rzp_test_YourTestKeyHere",
        amount: totalAmount * 100,
        currency: "INR",
        name: "KRAYVO",
        description: "Order Checkout",
        handler: function(response) {
          alert('Payment successful!');
          cart = cart.filter(i => !krayvoItems.some(ci => ci.id === i.id));
          localStorage.setItem('krayvo_cart', JSON.stringify(cart));
          renderCart();
        },
        prefill: { email: "guest@example.com" },
        theme: { color: "#6366f1" }
      };
      new Razorpay(options).open();
    };
    renderCart();
  </script>
</body>
</html>
