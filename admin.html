<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | KRAYVO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    /* Admin specific overrides */
    .admin-container { padding: 24px; }
    .login-container { max-width: 400px; margin: 80px auto; background: var(--card); padding: 32px; border-radius: 24px; text-align: center; }
    .login-container input { width: 100%; margin: 12px 0; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
    .hidden { display: none; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--success); color: white; padding: 12px 20px; border-radius: 12px; z-index: 2000; }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-container">
    <h2><i class="fas fa-crown"></i> KRAYVO Admin</h2>
    <p style="margin:16px 0;">Sign in to manage products</p>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="btn btn-primary" style="width:100%;" onclick="adminLogin()">Login</button>
    <button class="btn btn-outline" style="width:100%; margin-top:12px;" onclick="showRegister()">Create Admin Account</button>
    <div id="loginError" style="color:var(--danger); margin-top:12px;"></div>
  </div>

  <div id="registerScreen" class="login-container hidden">
    <h2>Create Account</h2>
    <input type="email" id="registerEmail" placeholder="Email">
    <input type="password" id="registerPassword" placeholder="Password (min 6 chars)">
    <button class="btn btn-primary" style="width:100%;" onclick="adminRegister()">Register</button>
    <button class="btn btn-outline" style="width:100%; margin-top:12px;" onclick="showLogin()">Back to Login</button>
    <div id="registerError" style="color:var(--danger); margin-top:12px;"></div>
  </div>

  <div id="adminDashboard" class="hidden">
    <div class="admin-container">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--border); margin-bottom:32px;">
        <h1 style="color:var(--primary);">KRAYVO Admin</h1>
        <div>
          <span id="adminEmail"></span>
          <button class="btn btn-outline" onclick="logout()">Logout</button>
          <a href="index.html" target="_blank" class="btn btn-outline">View Store</a>
        </div>
      </div>
      <div class="card" style="margin-bottom:32px;">
        <h2>Add/Edit Product</h2>
        <div style="display:flex; gap:12px; margin-bottom:20px;" id="platformButtons">
          <button class="filter-btn active" data-platform="krayvo">KRAYVO</button>
          <button class="filter-btn" data-platform="amazon">Amazon</button>
          <button class="filter-btn" data-platform="flipkart">Flipkart</button>
          <button class="filter-btn" data-platform="myntra">Myntra</button>
          <button class="filter-btn" data-platform="savana">Savana</button>
          <button class="filter-btn" data-platform="meesho">Meesho</button>
          <button class="filter-btn" data-platform="ajio">Ajio</button>
        </div>
        <form id="productForm" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:20px;">
          <div style="display:flex; flex-direction:column; gap:6px;"><label>Product Name *</label><input type="text" id="prodName" required></div>
          <div style="display:flex; flex-direction:column; gap:6px;"><label>Brand</label><input type="text" id="prodBrand"></div>
          <div style="display:flex; flex-direction:column; gap:6px;"><label>Price (₹) *</label><input type="number" id="prodPrice" required></div>
          <div style="display:flex; flex-direction:column; gap:6px;"><label>Original Price</label><input type="number" id="prodOriginalPrice"></div>
          <div style="display:flex; flex-direction:column; gap:6px;"><label>Category</label><select id="prodCategory"><option>Mobile</option><option>Fashion</option><option>Beauty</option><option>Electronics</option><option>Home & Kitchen</option><option>Accessories</option><option>Books</option></select></div>
          <div style="display:flex; flex-direction:column; gap:6px;"><label>Image URL</label><input type="url" id="imageUrl" placeholder="https://..."></div>
          <div style="display:flex; flex-direction:column; gap:6px;"><label>Affiliate Link</label><input type="url" id="affiliateLink"></div>
          <div style="grid-column:1/-1; display:flex; gap:12px;">
            <button type="submit" class="btn btn-primary">Publish</button>
            <button type="button" id="cancelEdit" class="btn btn-outline" style="display:none;" onclick="resetForm()">Cancel</button>
          </div>
        </form>
      </div>
      <div class="card">
        <h2>All Products</h2>
        <div id="productList" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:20px; margin-top:20px;"></div>
      </div>
    </div>
  </div>

  <script src="js/firebase.js"></script>
  <script src="js/script.js"></script>
  <script>
    // Admin auth
    let editingId = null;
    let currentPlatform = "krayvo";
    const allowedAdmins = ['bibekpatra307@gmail.com']; // CHANGE TO YOUR EMAIL

    function showToastAdmin(msg) { showToast(msg); }

    async function adminLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pwd = document.getElementById('loginPassword').value;
      try {
        const user = await auth.signInWithEmailAndPassword(email, pwd);
        if (!allowedAdmins.includes(user.user.email)) { await auth.signOut(); throw new Error('Not authorized'); }
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
        document.getElementById('adminEmail').innerText = user.user.email;
        loadProducts();
      } catch(e) { document.getElementById('loginError').innerText = e.message; }
    }

    async function adminRegister() {
      const email = document.getElementById('registerEmail').value.trim();
      const pwd = document.getElementById('registerPassword').value;
      try {
        const user = await auth.createUserWithEmailAndPassword(email, pwd);
        if (!allowedAdmins.includes(email)) { await auth.signOut(); throw new Error('Account created but not admin. Contact super admin.'); }
        document.getElementById('registerScreen').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
        document.getElementById('adminEmail').innerText = email;
        loadProducts();
      } catch(e) { document.getElementById('registerError').innerText = e.message; }
    }

    function showLogin() {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('registerScreen').classList.add('hidden');
    }
    function showRegister() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('registerScreen').classList.remove('hidden');
    }
    function logout() { auth.signOut(); location.reload(); }

    auth.onAuthStateChanged(async (user) => {
      if (user && allowedAdmins.includes(user.email)) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
        document.getElementById('adminEmail').innerText = user.email;
        loadProducts();
      } else {
        if (user) await auth.signOut();
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('adminDashboard').classList.add('hidden');
      }
    });

    // Platform selection
    document.querySelectorAll('#platformButtons .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentPlatform = btn.dataset.platform;
        document.querySelectorAll('#platformButtons .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // Load products from Firestore
    function loadProducts() {
      db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snap => {
        const products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderProductList(products);
      });
    }

    function renderProductList(products) {
      const container = document.getElementById('productList');
      if (!products.length) { container.innerHTML = '<p>No products yet.</p>'; return; }
      container.innerHTML = products.map(p => `
        <div class="card" style="padding:12px;">
          <img src="${p.imageUrl || 'https://placehold.co/400x400/1e293b/white?text=Product'}" style="width:100%; height:160px; object-fit:cover; border-radius:12px;" onerror="this.src='https://placehold.co/400x400/1e293b/white?text=Error'">
          <h4 style="margin:8px 0;">${escapeHtml(p.name)}</h4>
          <p>₹${p.price} ${p.originalPrice ? `<del>₹${p.originalPrice}</del>` : ''}<br><small>${p.platform || 'krayvo'} | ${p.category}</small></p>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-primary btn-sm" onclick="editProduct('${p.id}')">Edit</button>
            <button class="btn btn-outline btn-sm" style="color:var(--danger); border-color:var(--danger);" onclick="deleteProduct('${p.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])) || ''; }

    // Form submit
    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById('prodName').value.trim(),
        brand: document.getElementById('prodBrand').value.trim(),
        price: parseFloat(document.getElementById('prodPrice').value),
        originalPrice: parseFloat(document.getElementById('prodOriginalPrice').value) || null,
        category: document.getElementById('prodCategory').value,
        platform: currentPlatform,
        imageUrl: document.getElementById('imageUrl').value.trim() || null,
        affiliateLink: document.getElementById('affiliateLink').value.trim() || null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      if (!data.name || isNaN(data.price)) { showToastAdmin('Name and price required'); return; }
      try {
        if (editingId) {
          await db.collection('products').doc(editingId).update(data);
          showToastAdmin('Updated');
        } else {
          data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('products').add(data);
          showToastAdmin('Added');
        }
        resetForm();
      } catch(err) { showToastAdmin(err.message); }
    });

    window.editProduct = async (id) => {
      const doc = await db.collection('products').doc(id).get();
      if (!doc.exists) return;
      const p = doc.data();
      editingId = id;
      document.getElementById('prodName').value = p.name;
      document.getElementById('prodBrand').value = p.brand || '';
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodOriginalPrice').value = p.originalPrice || '';
      document.getElementById('prodCategory').value = p.category || 'Mobile';
      document.getElementById('imageUrl').value = p.imageUrl || '';
      document.getElementById('affiliateLink').value = p.affiliateLink || '';
      currentPlatform = p.platform || 'krayvo';
      document.querySelectorAll('#platformButtons .filter-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.querySelector(`#platformButtons .filter-btn[data-platform="${currentPlatform}"]`);
      if(activeBtn) activeBtn.classList.add('active');
      document.getElementById('cancelEdit').style.display = 'inline-block';
    };

    window.deleteProduct = async (id) => {
      if (confirm('Delete this product?')) {
        await db.collection('products').doc(id).delete();
        showToastAdmin('Deleted');
      }
    };

    function resetForm() {
      editingId = null;
      document.getElementById('productForm').reset();
      document.getElementById('cancelEdit').style.display = 'none';
      currentPlatform = 'krayvo';
      document.querySelectorAll('#platformButtons .filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('#platformButtons .filter-btn[data-platform="krayvo"]').classList.add('active');
    }
  </script>
</body>
</html>
