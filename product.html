<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | KRAYVO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    /* Same theme variables and basic styles as index.html */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --primary: #6366f1; --primary-dark: #4f46e5; --bg: #f8fafc; --card: #ffffff;
      --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --success: #10b981; --danger: #ef4444;
    }
    [data-theme="dark"] {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text-muted: #94a3b8; --border: #334155;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; }
    .product-detail { background: var(--card); border-radius: 24px; padding: 24px; border: 1px solid var(--border); }
    .img-container { border-radius: 20px; overflow: hidden; margin-bottom: 20px; }
    .img-container img { width: 100%; max-height: 400px; object-fit: contain; background: #1e293b; }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.7); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
    .product-name { font-size: 1.8rem; font-weight: 700; margin: 16px 0 8px; }
    .price-section { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
    .discount-price { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .original-price { font-size: 1.2rem; color: var(--text-muted); text-decoration: line-through; }
    .discount-badge { background: var(--success); color: white; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
    .buy-btn, .cart-btn {
      display: inline-block; margin: 12px 8px 0 0;
      padding: 12px 28px; border-radius: 40px;
      font-weight: 700; text-decoration: none; border: none; cursor: pointer; font-size: 1rem;
    }
    .buy-btn { background: var(--primary); color: white; }
    .buy-btn:hover { background: var(--primary-dark); }
    .cart-btn { background: var(--border); color: var(--text); }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #10b981; color: white; padding: 12px 20px; border-radius: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Back to store</a>
    <div class="product-detail" id="productDetail">Loading...</div>
  </div>
  <script>
    const DEMO_PRODUCTS = (()=>{
      const platforms = ['krayvo','amazon','flipkart','myntra','savana','ajio','meesho'];
      const categories = ["Mobile","Fashion","Beauty","Electronics","Home & Kitchen","Accessories","Books"];
      const brands = {krayvo:'KRAYVO',amazon:'AmazonBasics',flipkart:'Flipkart SmartBuy',myntra:'Myntra',savana:'Savana',ajio:'Ajio',meesho:'Meesho'};
      const arr=[];
      for(const p of platforms){for(let i=1;i<=20;i++){const c=categories[i%categories.length];const pr=Math.floor(Math.random()*5000)+299;const op=pr+Math.floor(Math.random()*3000)+200;arr.push({id:`demo_${p}_${i}`,name:`${brands[p]} ${c} ${i}`,brand:brands[p],price:pr,originalPrice:op,category:c,platform:p,imageUrl:null,affiliateLink:p==='krayvo'?'#':`https://www.${p}.com`,createdAt:new Date()});}}return arr;})();
    
    function getProductImage(p){if(p.imageData&&p.imageData.startsWith('data:image'))return p.imageData;if(p.imageUrl&&p.imageUrl.trim())return p.imageUrl;const e={Mobile:"📱",Fashion:"👕",Beauty:"💄",Electronics:"💻","Home & Kitchen":"🏠",Accessories:"⌚",Books:"📚"};const i=e[p.category]||"📦";return `https://placehold.co/600x400/1e293b/white?text=${i}`;}

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const product = DEMO_PRODUCTS.find(p => p.id === id);
    if (product) {
      const discount = product.originalPrice ? Math.round((1 - product.price/product.originalPrice)*100) : 0;
      document.getElementById('productDetail').innerHTML = `
        <div class="img-container"><img src="${getProductImage(product)}" alt="${product.name}"></div>
        <div class="badge"><i class="fas fa-store"></i> ${product.platform.toUpperCase()}</div>
        <h1 class="product-name">${product.name}</h1>
        <p style="color:var(--text-muted);">${product.brand} · ${product.category}</p>
        <div class="price-section">
          <span class="discount-price">₹${product.price}</span>
          ${product.originalPrice ? `<span class="original-price">₹${product.originalPrice}</span>` : ''}
          ${discount > 0 ? `<span class="discount-badge">${discount}% OFF</span>` : ''}
        </div>
        <button class="cart-btn" onclick="addToCart('${product.id}')">🛒 Add to Cart</button>
        <button class="buy-btn" onclick="buyNow()">Buy Now →</button>
      `;
      window.addToCart = (pid) => {
        let cart = JSON.parse(localStorage.getItem('krayvo_cart')) || [];
        const existing = cart.find(i => i.id === pid);
        if(existing) existing.qty++; else cart.push({id:pid, qty:1});
        localStorage.setItem('krayvo_cart', JSON.stringify(cart));
        showToast('Added to cart');
      };
      window.buyNow = () => {
        if (product.platform === 'krayvo' || !product.platform) {
          const options = {
            key: "rzp_test_YourTestKeyHere",
            amount: product.price * 100,
            currency: "INR",
            name: "KRAYVO",
            description: product.name,
            handler: function(res){ showToast('Payment successful!'); },
            prefill: { email: "guest@example.com" },
            theme: { color: "#6366f1" }
          };
          new Razorpay(options).open();
        } else {
          if (product.affiliateLink && product.affiliateLink !== '#') window.open(product.affiliateLink, '_blank');
          else showToast('No link available', 'error');
        }
      };
    } else {
      document.getElementById('productDetail').innerHTML = '<h2>Product not found</h2>';
    }
    function showToast(msg, type='success') {
      const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg;
      t.style.background = type==='error'?'#ef4444':'#10b981';
      document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
    }
  </script>
</body>
</html>
