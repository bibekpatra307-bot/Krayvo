<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="KRAYVO - Shop Smart, Live Better. Premium products from KRAYVO, Amazon, Flipkart, Myntra, Ajio, Meesho, Savana">
  <title>KRAYVO | Premium Multi‑Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Playfair Display', serif;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
      --radius: 20px;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }
    .skeleton-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .skeleton-img { height: 220px; background: var(--bg); }
    .skeleton-info { padding: 14px; }
    .skeleton-title { height: 20px; background: var(--bg); margin-bottom: 10px; border-radius: 8px; width: 80%; }
    .skeleton-price { height: 24px; background: var(--bg); width: 40%; border-radius: 8px; }
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 12px 0;
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .logo {
      font-family: var(--font-display);
      font-size: 1.8rem; font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }
    .nav-icons { display: flex; gap: 12px; align-items: center; }
    .nav-icons button {
      background: none; border: none;
      font-size: 1.2rem; cursor: pointer;
      color: var(--text); position: relative;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .nav-icons button:hover { background: var(--bg); }
    .badge {
      position: absolute; top: -6px; right: -8px;
      background: var(--danger); color: white;
      font-size: 0.65rem; border-radius: 20px;
      padding: 2px 6px;
    }
    .theme-toggle { background: var(--bg); border: 1px solid var(--border); border-radius: 40px; width: 36px; height: 36px; }
    .search-section { margin: 16px auto 0; max-width: 700px; width: 100%; }
    .search-wrapper input {
      width: 100%; padding: 14px 24px;
      border-radius: 60px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text);
      font-size: 1rem;
    }
    .platform-filters, .category-filters {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 12px;
      margin: 24px 0 16px;
      padding-bottom: 8px;
    }
    .platform-filters { margin-top: 24px; }
    .platform-btn, .category-pill {
      flex: 0 0 auto;
      padding: 10px 24px;
      border-radius: 40px;
      background: var(--card);
      border: 1px solid var(--border);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .category-pill { font-weight: 500; font-size: 0.9rem; padding: 8px 20px; }
    .platform-btn.active, .category-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .speed-banner {
      background: linear-gradient(120deg, #1e1b2e, #2d2a4e);
      border-radius: 28px;
      padding: 20px 30px;
      margin: 10px 0 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      color: white;
    }
    .speed-banner h3 { font-size: 1.6rem; }
    .adidas-tag { background: #232f3e; padding: 6px 16px; border-radius: 40px; font-weight: 600; }
    .products-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 20px 0 20px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .product-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .product-img {
      position: relative;
      height: 220px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }
    .marketplace-badge {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600;
      color: white; display: flex; align-items: center; gap: 4px;
    }
    .wishlist-btn {
      position: absolute; top: 10px; right: 10px;
      background: var(--card); border-radius: 50%; width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s; box-shadow: var(--shadow);
      color: var(--text-muted);
    }
    .wishlist-btn.active { color: var(--danger); background: #fff0f0; }
    .product-info { padding: 14px; }
    .product-brand { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .product-name {
      font-weight: 600; font-size: 1rem; margin: 6px 0;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .price-row {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 8px; margin: 10px 0;
    }
    .original-price { text-decoration: line-through; font-size: 0.85rem; color: var(--text-muted); }
    .discount-price { font-weight: 800; font-size: 1.2rem; color: var(--primary); }
    .discount-badge { background: var(--success); color: white; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; }
    .buy-btn {
      width: 100%; margin-top: 8px; background: var(--primary); color: white;
      border: none; padding: 10px; border-radius: 40px; font-weight: 700;
      cursor: pointer; transition: 0.2s;
    }
    .buy-btn:hover { background: var(--primary-dark); }
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: 0.2s;
    }
    .modal.open { opacity: 1; pointer-events: all; }
    .modal-content {
      background: var(--card); border-radius: 28px; padding: 24px;
      width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;
    }
    .wishlist-item {
      display: flex; gap: 12px; align-items: center;
      margin-bottom: 16px; padding: 8px; border-bottom: 1px solid var(--border);
    }
    .wishlist-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; }
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--text); color: white; padding: 12px 20px;
      border-radius: 40px; z-index: 1100; animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 680px) {
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .platform-btn, .category-pill { font-size: 0.8rem; padding: 6px 14px; }
    }
    footer { text-align: center; padding: 30px 0; border-top: 1px solid var(--border); margin-top: 40px; }
    .no-products { text-align: center; padding: 50px; color: var(--text-muted); grid-column: 1 / -1; }
    .error-banner { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
    .stats-badge { background: var(--primary); color: white; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; margin-left: 8px; }
  </style>
</head>
<body>

<div class="navbar">
  <div class="container nav-inner">
    <a href="#" class="logo">KRAYVO</a>
    <div class="nav-icons">
      <button onclick="openWishlistModal()"><i class="far fa-heart"></i><span class="badge" id="wishlistCount">0</span></button>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      <button onclick="openCart()">🛒<span class="badge" id="cartCount">0</span></button>
      <button onclick="openAuth()">👤</button>
    </div>
  </div>
  <div class="container search-section">
    <div class="search-wrapper">
      <input type="text" id="searchInput" placeholder="Search products by name, brand, or category..." oninput="updateFilters()">
    </div>
  </div>
</div>

<main class="container">
  <div class="platform-filters" id="platformFilters"></div>
  <div class="category-filters" id="categoryFilters"></div>

  <div class="speed-banner">
    <div><h3>⚡ Speed starts here</h3><p>Min. 40% Off | Power every step with ADIDAS</p></div>
    <div class="adidas-tag">🔥 ADIDAS MEGA SALE</div>
  </div>

  <div class="products-header">
    <h2 id="sectionTitle">Loading products...</h2>
    <span style="color:var(--text-muted);">Live prices · Instant updates</span>
  </div>
  <div id="errorMessage" class="error-banner" style="display:none;"></div>
  <div class="product-grid" id="productGrid">
    <div class="skeleton-grid" id="skeletonLoader">
      <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-info"><div class="skeleton-title"></div><div class="skeleton-price"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-info"><div class="skeleton-title"></div><div class="skeleton-price"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-info"><div class="skeleton-title"></div><div class="skeleton-price"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-info"><div class="skeleton-title"></div><div class="skeleton-price"></div></div></div>
    </div>
  </div>
</main>

<footer><div class="container"><p>© 2026 KRAYVO — Own products via Razorpay | Marketplace products redirect to official stores.</p></div></footer>

<!-- Modals -->
<div id="cartModal" class="modal"><div class="modal-content"><h3>Your Cart</h3><div id="cartItems"></div><div style="margin-top:16px; display:flex; justify-content:space-between;"><strong>Total: ₹<span id="cartTotal">0</span></strong><button class="buy-btn" style="width:auto; padding:8px 20px;" onclick="checkoutCart()">Checkout</button></div><button onclick="closeCart()" style="margin-top:12px; padding:8px 16px;">Close</button></div></div>
<div id="wishlistModal" class="modal"><div class="modal-content"><h3>❤️ Your Wishlist</h3><div id="wishlistItems"></div><button onclick="closeWishlistModal()" style="margin-top:12px; padding:8px 16px;">Close</button></div></div>
<div id="authModal" class="modal"><div class="modal-content"><h3>Login / Register</h3><input type="email" id="authEmail" placeholder="Email" style="width:100%; margin:8px 0; padding:10px;"><input type="password" id="authPassword" placeholder="Password" style="width:100%; margin:8px 0; padding:10px;"><button class="buy-btn" onclick="emailLogin()">Login</button><button class="buy-btn" style="background:transparent; color:var(--primary);" onclick="emailSignup()">Create Account</button><button class="buy-btn" style="background:#fff; color:#000;" onclick="googleLogin()">Google Sign-in</button><button onclick="closeAuth()" style="margin-top:12px;">Close</button></div></div>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyAe2LRnVIUWhROFBevXemEJJMUzqLW0Azc",
    authDomain: "krayvo-131a8.firebaseapp.com",
    projectId: "krayvo-131a8",
    storageBucket: "krayvo-131a8.firebasestorage.app",
    messagingSenderId: "278539390638",
    appId: "1:278539390638:web:38cefde7899eb3c883a73f"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let allProducts = [];
  let cart = JSON.parse(localStorage.getItem('krayvo_cart')) || [];
  let wishlist = JSON.parse(localStorage.getItem('krayvo_wishlist')) || [];
  let currentPlatform = "krayvo";
  let currentCategory = "For You";
  let searchQuery = "";
  let isLoading = true;
  let dbError = false;

  const platforms = [
    { key: 'krayvo', label: 'KRAYVO', icon: 'fas fa-crown', color: '#6366f1' },
    { key: 'amazon', label: 'Amazon', icon: 'fab fa-amazon', color: '#FF9900' },
    { key: 'flipkart', label: 'Flipkart', icon: 'fas fa-store', color: '#2874f0' },
    { key: 'myntra', label: 'Myntra', icon: 'fas fa-tshirt', color: '#e91e63' },
    { key: 'savana', label: 'Savana', icon: 'fas fa-leaf', color: '#2e7d32' },
    { key: 'ajio', label: 'Ajio', icon: 'fas fa-shopping-bag', color: '#f97316' },
    { key: 'meesho', label: 'Meesho', icon: 'fas fa-gem', color: '#f54d2e' }
  ];
  
  const categories = ["For You", "Mobile", "Fashion", "Beauty", "Electronics", "Home & Kitchen", "Accessories", "Books"];
  const categoryImages = { Mobile: "📱", Fashion: "👕", Beauty: "💄", Electronics: "💻", "Home & Kitchen": "🏠", Accessories: "⌚", Books: "📚" };

  // FALLBACK DEMO DATA - used if Firestore is empty or fails
  function getFallbackProducts() {
    const demoProducts = [];
    const brandMap = { krayvo: 'KRAYVO', amazon: 'Amazon', flipkart: 'Flipkart', myntra: 'Myntra', ajio: 'Ajio', meesho: 'Meesho', savana: 'Savana' };
    for (const platform of platforms) {
      const brand = brandMap[platform.key];
      for (let i = 1; i <= 20; i++) {
        const cat = categories[Math.floor(Math.random() * (categories.length - 1)) + 1];
        const price = Math.floor(Math.random() * 5000) + 299;
        const originalPrice = price + Math.floor(Math.random() * 3000) + 200;
        demoProducts.push({
          id: `fallback_${platform.key}_${i}`,
          name: `${brand} ${cat} Item ${i}`,
          brand: brand,
          price: price,
          originalPrice: originalPrice,
          category: cat,
          platform: platform.key,
          imageData: null,
          imageUrl: null,
          affiliateLink: platform.key === 'krayvo' ? '#' : `https://www.${platform.key}.com`,
        });
      }
    }
    return demoProducts;
  }

  function showToast(msg, type = 'success') {
    const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg;
    t.style.background = type === 'error' ? '#ef4444' : '#10b981';
    document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
  }

  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

  function updateCartUI() {
    const count = cart.reduce((s,i)=>s+i.qty,0);
    document.getElementById('cartCount').innerText = count;
    localStorage.setItem('krayvo_cart', JSON.stringify(cart));
  }

  function updateWishlistUI() {
    document.getElementById('wishlistCount').innerText = wishlist.length;
    localStorage.setItem('krayvo_wishlist', JSON.stringify(wishlist));
    renderProducts();
  }

  function addToCart(pid) {
    const existing = cart.find(i => i.id === pid);
    if(existing) existing.qty++; else cart.push({ id: pid, qty: 1 });
    updateCartUI(); showToast('Added to cart');
  }

  function removeFromCart(pid) {
    cart = cart.filter(i => i.id !== pid); updateCartUI(); renderCart();
  }

  async function renderCart() {
    const container = document.getElementById('cartItems');
    if(cart.length===0) { container.innerHTML='<p>Cart empty</p>'; document.getElementById('cartTotal').innerText='0'; return; }
    let total=0; const prodMap = {}; allProducts.forEach(p=>prodMap[p.id]=p);
    container.innerHTML = cart.map(item=>{
      const p = prodMap[item.id]; if(!p) return '';
      total += p.price * item.qty;
      return `<div style="display:flex; justify-content:space-between; margin:8px 0;"><span>${escapeHtml(p.name)} x${item.qty} ₹${p.price}</span><button onclick="removeFromCart('${item.id}')" style="background:var(--danger); color:white; border:none; padding:4px 12px; border-radius:20px;">Remove</button></div>`;
    }).join('');
    document.getElementById('cartTotal').innerText = total;
  }

  function openCart() { renderCart(); document.getElementById('cartModal').classList.add('open'); }
  function closeCart() { document.getElementById('cartModal').classList.remove('open'); }
  function openWishlistModal() { renderWishlistModal(); document.getElementById('wishlistModal').classList.add('open'); }
  function closeWishlistModal() { document.getElementById('wishlistModal').classList.remove('open'); }
  
  function renderWishlistModal() {
    const container = document.getElementById('wishlistItems');
    const items = allProducts.filter(p => wishlist.includes(p.id));
    if(items.length===0) { container.innerHTML='<p>Your wishlist is empty.</p>'; return; }
    container.innerHTML = items.map(p => {
      const imgSrc = getProductImage(p);
      return `<div class="wishlist-item">
        <img src="${imgSrc}" alt="${escapeHtml(p.name)}">
        <div style="flex:1"><strong>${escapeHtml(p.name)}</strong><br>₹${p.price}</div>
        <button onclick="removeFromWishlist('${p.id}')" style="background:var(--danger); color:white; border:none; padding:6px 12px; border-radius:20px;">Remove</button>
      </div>`;
    }).join('');
  }

  function removeFromWishlist(pid) { wishlist = wishlist.filter(id => id !== pid); updateWishlistUI(); renderWishlistModal(); showToast('Removed from wishlist'); }
  function toggleWishlist(pid) {
    if(wishlist.includes(pid)) { wishlist = wishlist.filter(id => id !== pid); showToast('Removed from wishlist'); }
    else { wishlist.push(pid); showToast('Added to wishlist'); }
    updateWishlistUI();
  }

  function openAuth() { document.getElementById('authModal').classList.add('open'); }
  function closeAuth() { document.getElementById('authModal').classList.remove('open'); }
  async function emailLogin() { try { await auth.signInWithEmailAndPassword(document.getElementById('authEmail').value, document.getElementById('authPassword').value); showToast('Logged in'); closeAuth(); } catch(e){ showToast(e.message,'error'); } }
  async function emailSignup() { try { await auth.createUserWithEmailAndPassword(document.getElementById('authEmail').value, document.getElementById('authPassword').value); showToast('Account created'); closeAuth(); } catch(e){ showToast(e.message,'error'); } }
  async function googleLogin() { const provider = new firebase.auth.GoogleAuthProvider(); try { await auth.signInWithPopup(provider); showToast('Google signin'); closeAuth(); } catch(e){ showToast(e.message,'error'); } }

  function toggleTheme() { 
    const html = document.documentElement; 
    const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; 
    html.setAttribute('data-theme', newTheme); 
    localStorage.setItem('theme', newTheme); 
  }
  if(localStorage.getItem('theme')) document.documentElement.setAttribute('data-theme', localStorage.getItem('theme'));

  function getProductImage(product) {
    if (product.imageData && product.imageData.startsWith('data:image')) return product.imageData;
    if (product.imageUrl && product.imageUrl.trim() !== '') return product.imageUrl;
    const categoryIcon = categoryImages[product.category] || "📦";
    return `https://placehold.co/400x400/eee?text=${categoryIcon}`;
  }

  async function handleBuyNow(product) {
    if (product.platform === 'krayvo' || !product.platform) {
      const options = {
        key: "rzp_test_YourTestKeyHere",
        amount: product.price * 100,
        currency: "INR",
        name: "KRAYVO",
        description: product.name,
        handler: function(response) {
          showToast(`Payment successful! Order ID: ${response.razorpay_payment_id}`);
          cart = cart.filter(i => i.id !== product.id);
          updateCartUI();
        },
        prefill: { email: auth.currentUser?.email || "guest@example.com" },
        theme: { color: "#6366f1" }
      };
      const rzp = new Razorpay(options);
      rzp.open();
    } else {
      if (product.affiliateLink && product.affiliateLink !== '#' && product.affiliateLink !== '') {
        window.open(product.affiliateLink, '_blank');
      } else {
        showToast('Affiliate link not available', 'error');
      }
    }
  }

  function checkoutCart() {
    const krayvoCartItems = cart.filter(item => {
      const p = allProducts.find(prod => prod.id === item.id);
      return p && (p.platform === 'krayvo' || !p.platform);
    });
    if(krayvoCartItems.length === 0) { showToast('Cart contains only marketplace items. Please buy them directly from their store.', 'error'); return; }
    let totalAmount = 0;
    krayvoCartItems.forEach(item => { const p = allProducts.find(prod => prod.id === item.id); if(p) totalAmount += p.price * item.qty; });
    const options = {
      key: "rzp_test_YourTestKeyHere",
      amount: totalAmount * 100,
      currency: "INR",
      name: "KRAYVO",
      description: "Cart Checkout",
      handler: function(response) {
        showToast(`Order placed! Payment ID: ${response.razorpay_payment_id}`);
        cart = cart.filter(i => !krayvoCartItems.some(ci => ci.id === i.id));
        updateCartUI();
        closeCart();
      },
      theme: { color: "#6366f1" }
    };
    const rzp = new Razorpay(options);
    rzp.open();
  }

  function updateFilters() {
    searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
    renderProducts();
  }

  function getFilteredProducts() {
    let filtered = [];
    if (currentPlatform === 'krayvo') {
      filtered = allProducts.filter(p => !p.platform || p.platform === 'krayvo');
    } else {
      filtered = allProducts.filter(p => p.platform === currentPlatform);
    }
    if (searchQuery) {
      filtered = filtered.filter(p => 
        (p.name && p.name.toLowerCase().includes(searchQuery)) ||
        (p.brand && p.brand.toLowerCase().includes(searchQuery)) ||
        (p.category && p.category.toLowerCase().includes(searchQuery))
      );
    }
    if (currentCategory !== "For You") {
      filtered = filtered.filter(p => p.category === currentCategory);
    } else {
      const recent = [...filtered].sort((a,b) => {
        const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
        const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
        return dateB - dateA;
      }).slice(0, 12);
      const discounted = filtered.filter(p => p.originalPrice && p.price < p.originalPrice).slice(0, 8);
      const combined = [...recent, ...discounted];
      filtered = combined.filter((v,i,a)=>a.findIndex(t=>t.id===v.id)===i);
      if(filtered.length === 0) filtered = allProducts.slice(0, 16);
    }
    return filtered;
  }

  function renderProducts() {
    const filtered = getFilteredProducts();
    const grid = document.getElementById('productGrid');
    if(filtered.length === 0) {
      grid.innerHTML = '<div class="no-products">✨ No products found. Try changing filters.</div>';
      return;
    }
    grid.innerHTML = filtered.map(p => {
      const imgSrc = getProductImage(p);
      const discountPercent = p.originalPrice ? Math.round((1 - p.price/p.originalPrice)*100) : 0;
      const platformInfo = platforms.find(plat => plat.key === (p.platform || 'krayvo')) || platforms[0];
      const isWishlisted = wishlist.includes(p.id);
      return `
        <div class="product-card" data-id="${p.id}">
          <div class="product-img">
            <img src="${imgSrc}" alt="${escapeHtml(p.name)}" loading="lazy">
            <div class="marketplace-badge"><i class="${platformInfo.icon}"></i> ${platformInfo.label}</div>
            <div class="wishlist-btn ${isWishlisted ? 'active' : ''}" onclick="event.stopPropagation();toggleWishlist('${p.id}')"><i class="fa${isWishlisted ? 's' : 'r'} fa-heart"></i></div>
          </div>
          <div class="product-info">
            <div class="product-brand">${escapeHtml(p.brand || platformInfo.label)}</div>
            <div class="product-name">${escapeHtml(p.name)}</div>
            <div class="price-row">
              ${p.originalPrice ? `<span class="original-price">₹${p.originalPrice}</span>` : ''}
              <span class="discount-price">₹${p.price}</span>
              ${discountPercent > 0 ? `<span class="discount-badge">${discountPercent}% OFF</span>` : ''}
            </div>
            <button class="buy-btn" onclick="event.stopPropagation();handleBuyNow(${JSON.stringify(p).replace(/"/g, '&quot;')})">Buy Now →</button>
          </div>
        </div>
      `;
    }).join('');
    document.getElementById('sectionTitle').innerHTML = `${currentPlatform.toUpperCase()} ${currentCategory !== "For You" ? `· ${currentCategory}` : '· For You'} <span class="stats-badge">${filtered.length} items</span>`;
  }

  function renderPlatformFilters() {
    const container = document.getElementById('platformFilters');
    container.innerHTML = platforms.map(plat => `<button class="platform-btn ${currentPlatform===plat.key?'active':''}" data-platform="${plat.key}"><i class="${plat.icon}" style="color:${currentPlatform===plat.key?'white':plat.color}"></i> ${plat.label}</button>`).join('');
    document.querySelectorAll('.platform-btn').forEach(btn => btn.addEventListener('click', () => { 
      currentPlatform = btn.dataset.platform; 
      currentCategory = "For You"; 
      renderPlatformFilters(); 
      renderCategoryFilters(); 
      renderProducts(); 
    }));
  }
  
  function renderCategoryFilters() {
    const container = document.getElementById('categoryFilters');
    container.innerHTML = categories.map(cat => `<span class="category-pill ${currentCategory===cat?'active':''}" data-category="${cat}">${cat}</span>`).join('');
    document.querySelectorAll('.category-pill').forEach(pill => pill.addEventListener('click', () => { 
      currentCategory = pill.dataset.category; 
      renderCategoryFilters(); 
      renderProducts(); 
    }));
  }

  // Seed Firestore with demo data if empty
  async function seedIfEmpty() {
    try {
      const snapshot = await db.collection('products').limit(1).get();
      if (snapshot.empty) {
        console.log("Database empty, seeding demo products...");
        const demoProducts = [];
        const brandMap = { krayvo: 'KRAYVO', amazon: 'AmazonBasics', flipkart: 'Flipkart SmartBuy', myntra: 'Myntra', ajio: 'Ajio', meesho: 'Meesho', savana: 'Savana' };
        for (const platform of platforms) {
          const brand = brandMap[platform.key];
          for (let i = 1; i <= 20; i++) {
            const cat = categories[Math.floor(Math.random() * (categories.length - 1)) + 1];
            const price = Math.floor(Math.random() * 5000) + 299;
            const originalPrice = price + Math.floor(Math.random() * 3000) + 200;
            demoProducts.push({
              name: `${brand} ${cat} Item ${i}`,
              brand: brand,
              price: price,
              originalPrice: originalPrice,
              category: cat,
              platform: platform.key,
              imageUrl: null,
              imageData: null,
              affiliateLink: platform.key === 'krayvo' ? '#' : `https://www.${platform.key}.com`,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              sellerId: 'system'
            });
          }
        }
        const batch = db.batch();
        demoProducts.forEach(prod => {
          const ref = db.collection('products').doc();
          batch.set(ref, prod);
        });
        await batch.commit();
        console.log("Demo products seeded successfully!");
        showToast("Demo products loaded!");
      }
    } catch (err) {
      console.error("Seed failed, using fallback:", err);
      dbError = true;
      allProducts = getFallbackProducts();
      renderProducts();
      document.getElementById('skeletonLoader').style.display = 'none';
      document.getElementById('errorMessage').style.display = 'block';
      document.getElementById('errorMessage').innerHTML = '⚠️ Unable to connect to database. Showing demo products. Please check your internet or Firebase settings.';
    }
  }

  function initFirestoreListener() {
    document.getElementById('skeletonLoader').style.display = 'grid';
    db.collection('products').orderBy('createdAt', 'desc').onSnapshot(async (snap) => {
      if (snap.empty) {
        await seedIfEmpty();
        return;
      }
      allProducts = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      if (isLoading) {
        isLoading = false;
        document.getElementById('skeletonLoader').style.display = 'none';
      }
      renderProducts();
      updateCartUI();
      updateWishlistUI();
    }, (error) => {
      console.error("Firestore error:", error);
      dbError = true;
      document.getElementById('skeletonLoader').style.display = 'none';
      document.getElementById('errorMessage').style.display = 'block';
      document.getElementById('errorMessage').innerHTML = '⚠️ Database connection issue. Using offline demo products.';
      allProducts = getFallbackProducts();
      renderProducts();
      updateCartUI();
      updateWishlistUI();
    });
  }

  // Initialization
  renderPlatformFilters();
  renderCategoryFilters();
  updateCartUI();
  updateWishlistUI();
  initFirestoreListener();
</script>
</body>
</html>
