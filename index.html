<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="KRAYVO - Shop Smart, Live Better. Compare Amazon, Flipkart, Myntra, Savana & Meesho deals live!">
  <title>KRAYVO | Multi‑Marketplace Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Playfair Display', serif;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
      --radius: 20px;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
    
    /* Navbar */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 12px 0;
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .logo {
      font-family: var(--font-display);
      font-size: 1.8rem; font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }
    .nav-icons { display: flex; gap: 12px; }
    .nav-icons button {
      background: none; border: none;
      font-size: 1.2rem; cursor: pointer;
      color: var(--text); position: relative;
    }
    .badge {
      position: absolute; top: -6px; right: -8px;
      background: var(--danger); color: white;
      font-size: 0.65rem; border-radius: 20px;
      padding: 2px 6px;
    }
    .theme-toggle {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 40px; width: 36px; height: 36px;
    }
    .search-section { margin: 16px auto 0; max-width: 700px; width: 100%; }
    .search-wrapper input {
      width: 100%; padding: 14px 24px;
      border-radius: 60px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text);
      font-size: 1rem;
    }
    
    /* Platform buttons row (single horizontal row, scrollable on small screens) */
    .platform-buttons {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 12px;
      margin: 24px 0 20px;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }
    .platform-btn {
      flex: 0 0 auto;
      padding: 10px 24px;
      border-radius: 40px;
      background: var(--card);
      border: 1px solid var(--border);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .platform-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .platform-btn i { font-size: 1.1rem; }
    
    /* Speed banner */
    .speed-banner {
      background: linear-gradient(120deg, #1e1b2e, #2d2a4e);
      border-radius: 28px;
      padding: 20px 30px;
      margin: 10px 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      color: white;
    }
    .speed-banner h3 { font-size: 1.6rem; }
    .adidas-tag { background: #232f3e; padding: 6px 16px; border-radius: 40px; font-weight: 600; }
    
    /* Platform Slider Section */
    .platform-section {
      margin: 50px 0;
    }
    .platform-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
      border-left: 5px solid var(--primary);
      padding-left: 16px;
    }
    .platform-title {
      font-size: 1.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .platform-title i { font-size: 1.7rem; }
    .slider-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .horiz-scroll {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
      gap: 20px;
      padding: 8px 4px 20px;
      scrollbar-width: thin;
      flex: 1;
    }
    .horiz-scroll::-webkit-scrollbar { height: 6px; }
    .product-card {
      flex: 0 0 220px;
      background: var(--card);
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
    }
    .product-img {
      height: 180px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
    }
    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product-info {
      padding: 12px;
    }
    .product-brand {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .product-name {
      font-weight: 600;
      font-size: 0.9rem;
      margin: 6px 0;
      white-space: normal;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .price {
      font-weight: 800;
      font-size: 1rem;
      color: var(--primary);
    }
    .old-price {
      text-decoration: line-through;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-left: 6px;
    }
    .buy-btn {
      width: 100%;
      margin-top: 10px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
    }
    .scroll-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: 0 6px;
      z-index: 5;
      box-shadow: var(--shadow);
    }
    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      opacity: 0; pointer-events: none;
      transition: 0.2s;
    }
    .modal.open { opacity: 1; pointer-events: all; }
    .modal-content {
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      width: 90%;
      max-width: 450px;
    }
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--text);
      color: white;
      padding: 12px 20px;
      border-radius: 40px;
      z-index: 1100;
    }
    @media (max-width: 680px) {
      .product-card { flex: 0 0 170px; }
      .platform-title { font-size: 1.3rem; }
      .scroll-btn { width: 32px; height: 32px; }
    }
    footer {
      text-align: center;
      padding: 30px 0;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
    .no-products {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      width: 100%;
    }
  </style>
</head>
<body>

<div class="navbar">
  <div class="container nav-inner">
    <a href="#" class="logo">KRAYVO</a>
    <div class="nav-icons">
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      <button onclick="openCart()">🛒<span class="badge" id="cartCount">0</span></button>
      <button onclick="openAuth()">👤</button>
    </div>
  </div>
  <div class="container search-section">
    <div class="search-wrapper">
      <input type="text" id="searchInput" placeholder="Search products across all platforms..." oninput="globalSearch()">
    </div>
  </div>
</div>

<main class="container">
  <!-- Platform Buttons (single horizontal row) -->
  <div class="platform-buttons" id="platformButtons"></div>

  <!-- Speed Banner -->
  <div class="speed-banner">
    <div>
      <h3>⚡ Speed starts here</h3>
      <p>Min. 40% Off | Power every step with ADIDAS</p>
    </div>
    <div class="adidas-tag">🔥 ADIDAS MEGA SALE</div>
  </div>

  <!-- Platform Sliders will be injected here -->
  <div id="platformsContainer"></div>
</main>

<footer class="footer">
  <div class="container">
    <p>© 2026 KRAYVO — Live prices from Amazon, Flipkart, Myntra, Savana, Meesho. Click product to visit official store.</p>
  </div>
</footer>

<!-- Cart Modal -->
<div id="cartModal" class="modal">
  <div class="modal-content">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>
    <div style="margin-top:16px; display:flex; justify-content:space-between;">
      <strong>Total: ₹<span id="cartTotal">0</span></strong>
      <button class="buy-btn" style="width:auto; padding:8px 20px;" onclick="checkout()">Checkout</button>
    </div>
    <button onclick="closeCart()" style="margin-top:12px;">Close</button>
  </div>
</div>

<!-- Auth Modal -->
<div id="authModal" class="modal">
  <div class="modal-content">
    <h3>Login / Register</h3>
    <input type="email" id="authEmail" placeholder="Email" style="width:100%; margin:8px 0; padding:10px;">
    <input type="password" id="authPassword" placeholder="Password" style="width:100%; margin:8px 0; padding:10px;">
    <button class="buy-btn" onclick="emailLogin()">Login</button>
    <button class="buy-btn" style="background:transparent; color:var(--primary);" onclick="emailSignup()">Create Account</button>
    <button class="buy-btn" style="background:#fff; color:#000;" onclick="googleLogin()">Google Sign-in</button>
    <button onclick="closeAuth()">Close</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAe2LRnVIUWhROFBevXemEJJMUzqLW0Azc",
    authDomain: "krayvo-131a8.firebaseapp.com",
    projectId: "krayvo-131a8",
    storageBucket: "krayvo-131a8.firebasestorage.app",
    messagingSenderId: "278539390638",
    appId: "1:278539390638:web:38cefde7899eb3c883a73f"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let allProducts = [];
  let cart = JSON.parse(localStorage.getItem('krayvo_cart')) || [];
  let searchQuery = "";
  let currentPlatform = "krayvo"; // for button highlighting

  // Platform definitions (KRAYVO first)
  const platforms = [
    { key: 'krayvo', label: 'KRAYVO Originals', icon: 'fas fa-crown', color: '#6366f1', affiliateDomain: '#' },
    { key: 'amazon', label: 'Amazon Deals', icon: 'fab fa-amazon', color: '#FF9900', affiliateDomain: 'https://amazon.in' },
    { key: 'flipkart', label: 'Flipkart Offers', icon: 'fas fa-store', color: '#2874f0', affiliateDomain: 'https://flipkart.com' },
    { key: 'myntra', label: 'Myntra Fashion', icon: 'fas fa-tshirt', color: '#e91e63', affiliateDomain: 'https://myntra.com' },
    { key: 'savana', label: 'Savana Picks', icon: 'fas fa-leaf', color: '#2e7d32', affiliateDomain: 'https://savana.com' },
    { key: 'meesho', label: 'Meesho Bargains', icon: 'fas fa-gem', color: '#f54d2e', affiliateDomain: 'https://meesho.com' }
  ];

  // Helper functions
  function showToast(msg, type='success') {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerText = msg;
    t.style.background = type === 'error' ? '#ef4444' : '#10b981';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
  }

  function updateCartUI() {
    const count = cart.reduce((s,i)=>s+i.qty,0);
    document.getElementById('cartCount').innerText = count;
    localStorage.setItem('krayvo_cart', JSON.stringify(cart));
  }

  function addToCart(pid) {
    const existing = cart.find(i => i.id === pid);
    if(existing) existing.qty++;
    else cart.push({ id: pid, qty: 1 });
    updateCartUI();
    showToast('Added to cart');
  }

  function removeFromCart(pid) {
    cart = cart.filter(i => i.id !== pid);
    updateCartUI();
    renderCart();
  }

  async function renderCart() {
    const container = document.getElementById('cartItems');
    if(cart.length===0) { container.innerHTML='<p>Cart empty</p>'; document.getElementById('cartTotal').innerText='0'; return; }
    let total=0;
    const prodMap = {};
    allProducts.forEach(p=>prodMap[p.id]=p);
    container.innerHTML = cart.map(item=>{
      const p = prodMap[item.id];
      if(!p) return '';
      total += p.price * item.qty;
      return `<div style="display:flex; justify-content:space-between; margin:8px 0;">
        <span>${escapeHtml(p.name)} x${item.qty} ₹${p.price}</span>
        <button onclick="removeFromCart('${item.id}')">Remove</button>
      </div>`;
    }).join('');
    document.getElementById('cartTotal').innerText = total;
  }

  function checkout() {
    if(cart.length===0) return showToast('Cart empty','error');
    window.open('https://razorpay.me/@bibekpatrabooks', '_blank');
    cart = [];
    updateCartUI();
    closeCart();
    showToast('Redirecting to payment');
  }

  function openCart() { renderCart(); document.getElementById('cartModal').classList.add('open'); }
  function closeCart() { document.getElementById('cartModal').classList.remove('open'); }
  function openAuth() { document.getElementById('authModal').classList.add('open'); }
  function closeAuth() { document.getElementById('authModal').classList.remove('open'); }

  async function emailLogin() {
    try {
      await auth.signInWithEmailAndPassword(document.getElementById('authEmail').value, document.getElementById('authPassword').value);
      showToast('Logged in'); closeAuth();
    } catch(e){ showToast(e.message,'error'); }
  }
  async function emailSignup() {
    try {
      await auth.createUserWithEmailAndPassword(document.getElementById('authEmail').value, document.getElementById('authPassword').value);
      showToast('Account created'); closeAuth();
    } catch(e){ showToast(e.message,'error'); }
  }
  async function googleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await auth.signInWithPopup(provider);
      showToast('Google signin'); closeAuth();
    } catch(e){ showToast(e.message,'error'); }
  }

  function toggleTheme() {
    const html = document.documentElement;
    const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
  }
  if(localStorage.getItem('theme')) document.documentElement.setAttribute('data-theme', localStorage.getItem('theme'));

  function escapeHtml(str) {
    if(!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
  }

  // Generate product card HTML
  function productCardHtml(p, platformKey) {
    let imgHtml = (p.imageData && p.imageData.startsWith('data:image')) ? `<img src="${p.imageData}" alt="${p.name}">` :
                  (p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}">` : 
                  `<div style="height:100%; display:flex; align-items:center; justify-content:center; font-size:3rem;">📦</div>`);
    const discount = p.originalPrice ? Math.round((1 - p.price/p.originalPrice)*100) : 0;
    return `
      <div class="product-card" data-affiliate="${p.affiliateLink || ''}" data-id="${p.id}" onclick="handleProductClick(event, '${p.affiliateLink || ''}')">
        <div class="product-img">${imgHtml}</div>
        <div class="product-info">
          <div class="product-brand">${escapeHtml(p.brand || platformKey.toUpperCase())}</div>
          <div class="product-name">${escapeHtml(p.name)}</div>
          <div>
            <span class="price">₹${p.price}</span>
            ${p.originalPrice ? `<span class="old-price">₹${p.originalPrice}</span>` : ''}
            ${discount > 0 ? `<span style="color:var(--success); font-size:0.7rem;"> -${discount}%</span>` : ''}
          </div>
          <button class="buy-btn" onclick="event.stopPropagation();addToCart('${p.id}')">Add to Cart</button>
        </div>
      </div>
    `;
  }

  // Render platform buttons
  function renderPlatformButtons() {
    const container = document.getElementById('platformButtons');
    if(!container) return;
    container.innerHTML = platforms.map(plat => `
      <button class="platform-btn ${currentPlatform === plat.key ? 'active' : ''}" data-platform="${plat.key}">
        <i class="${plat.icon}" style="color:${currentPlatform === plat.key ? 'white' : plat.color}"></i> ${plat.label}
      </button>
    `).join('');
    // Attach click events
    document.querySelectorAll('.platform-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentPlatform = btn.dataset.platform;
        renderPlatformButtons();
        scrollToPlatformSlider(currentPlatform);
      });
    });
  }

  // Scroll to a specific platform slider
  function scrollToPlatformSlider(platformKey) {
    const section = document.getElementById(`section-${platformKey}`);
    if(section) {
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  // Render all platform sliders
  function renderAllSliders() {
    const container = document.getElementById('platformsContainer');
    if(!container) return;
    let html = '';
    for(let plat of platforms) {
      let filtered = allProducts.filter(p => {
        // For KRAYVO, also include products with no platform or platform = 'krayvo'
        if(plat.key === 'krayvo') {
          return (!p.platform || p.platform === 'krayvo');
        }
        return p.platform === plat.key;
      });
      if(searchQuery) {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery) || (p.brand && p.brand.toLowerCase().includes(searchQuery)));
      }
      const sectionId = `slider-${plat.key}`;
      html += `
        <div class="platform-section" id="section-${plat.key}">
          <div class="platform-header">
            <div class="platform-title">
              <i class="${plat.icon}" style="color:${plat.color}"></i> ${plat.label}
            </div>
            <span style="font-size:0.75rem; color:var(--text-muted);">${filtered.length} products</span>
          </div>
          <div class="slider-wrapper">
            <button class="scroll-btn" onclick="scrollHoriz('${sectionId}', -300)">◀</button>
            <div class="horiz-scroll" id="${sectionId}">
              ${filtered.length ? filtered.map(p => productCardHtml(p, plat.key)).join('') : `<div class="no-products">✨ No products yet. Add via admin panel.</div>`}
            </div>
            <button class="scroll-btn" onclick="scrollHoriz('${sectionId}', 300)">▶</button>
          </div>
        </div>
      `;
    }
    container.innerHTML = html;
  }

  window.scrollHoriz = function(id, amount) {
    const el = document.getElementById(id);
    if(el) el.scrollBy({ left: amount, behavior: 'smooth' });
  };

  function handleProductClick(event, affiliateLink) {
    if(!event.target.closest('button') && affiliateLink && affiliateLink !== '#') {
      window.open(affiliateLink, '_blank');
    } else if(!event.target.closest('button') && (!affiliateLink || affiliateLink === '#')) {
      showToast('Affiliate link not available', 'info');
    }
  }

  function globalSearch() {
    searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
    renderAllSliders();
  }

  // Real-time Firestore listener
  db.collection('products').onSnapshot(snap => {
    allProducts = snap.docs.map(doc => ({ id: doc.id, ...doc.data(), price: doc.data().price || 0, originalPrice: doc.data().originalPrice || null }));
    renderAllSliders();
    updateCartUI();
  });

  // Seed demo products only if collection is empty (after a short delay to let existing data load)
  setTimeout(async () => {
    const snapshot = await db.collection('products').limit(1).get();
    if(snapshot.empty) {
      const demoProducts = [];
      const categories = ['Electronics', 'Fashion', 'Home', 'Beauty', 'Books', 'Mobiles', 'Toys'];
      const brands = ['Noise', 'boAt', 'Apple', 'Samsung', 'Puma', 'Nike', 'Roadster', 'Meesho', 'Savana', 'AmazonBasics', 'Flipkart SmartBuy'];
      
      for(let plat of platforms) {
        for(let i=1; i<=20; i++) {
          const randomCat = categories[Math.floor(Math.random() * categories.length)];
          const randomBrand = brands[Math.floor(Math.random() * brands.length)];
          const basePrice = Math.floor(Math.random() * 5000) + 499;
          const originalPrice = basePrice + Math.floor(Math.random() * 3000);
          demoProducts.push({
            name: `${plat.label} Product ${i}`,
            brand: randomBrand,
            price: basePrice,
            originalPrice: originalPrice,
            category: randomCat,
            platform: plat.key,
            imageData: null,
            affiliateLink: plat.key === 'krayvo' ? '#' : `${plat.affiliateDomain}/search?q=${encodeURIComponent(`product ${i}`)}`,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            sellerId: 'admin'
          });
        }
      }
      // Add some extra KRAYVO-specific products
      for(let i=1; i<=15; i++) {
        demoProducts.push({
          name: `KRAYVO Exclusive Item ${i}`,
          brand: 'KRAYVO',
          price: Math.floor(Math.random() * 2000) + 299,
          originalPrice: null,
          category: categories[i % categories.length],
          platform: 'krayvo',
          imageData: null,
          affiliateLink: '#',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          sellerId: 'admin'
        });
      }
      // Batch write (simple loop, okay for ~150 products)
      for(let prod of demoProducts) {
        await db.collection('products').add(prod);
      }
      showToast("🔥 20+ demo products per platform added! Your existing products are preserved.", "success");
    } else {
      // Just show a message that existing products are loaded
      console.log("Existing products found, no seeding performed.");
    }
  }, 2000);

  // Initial render
  renderPlatformButtons();
  updateCartUI();
</script>
</body>
</html>
