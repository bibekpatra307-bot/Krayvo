<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#fafafa">
  <title>KRAYVO | Shop Smart, Live Better</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
      --transition-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
      --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
      --shadow-md: 0 8px 30px rgba(0,0,0,0.08);
      --shadow-lg: 0 16px 50px rgba(0,0,0,0.12);
      --radius-xs: 6px;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
    }
    [data-theme="light"] {
      --bg-primary: #fafafa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f5f5f5;
      --text-primary: #0a0a0a;
      --text-secondary: #3d3d3d;
      --text-tertiary: #737373;
      --border-primary: #e5e5e5;
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-glow: rgba(99,102,241,0.2);
      --gradient-hero: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --success: #10b981;
      --danger: #ef4444;
      --star-color: #f59e0b;
    }
    [data-theme="dark"] {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-tertiary: #1a1a1a;
      --text-primary: #f5f5f5;
      --text-secondary: #c7c7c7;
      --text-tertiary: #8a8a8a;
      --border-primary: #2a2a2a;
      --accent-primary: #818cf8;
      --accent-secondary: #a78bfa;
      --accent-glow: rgba(129,140,248,0.25);
      --gradient-hero: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --success: #34d399;
      --danger: #f87171;
    }
    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.3s, color 0.3s;
      line-height: 1.6;
      min-height: 100vh;
    }
    .container { max-width: 1320px; margin: 0 auto; padding: 0 20px; }
    @media (max-width: 768px) { .container { padding: 0 14px; } }
    /* Navbar */
    .top-navbar {
      position: sticky; top: 0; z-index: 1000;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      backdrop-filter: blur(16px);
      padding: 12px 0;
    }
    .navbar-inner {
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }
    .logo-link {
      display: flex; align-items: center; gap: 10px; text-decoration: none;
    }
    .logo-icon {
      width: 42px; height: 42px;
      background: var(--gradient-hero);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 22px; color: white;
    }
    .logo-text {
      font-family: var(--font-display);
      font-weight: 700; font-size: 1.6rem;
      color: var(--text-primary);
    }
    .search-wrapper {
      flex: 1; max-width: 500px; position: relative;
    }
    .search-input {
      width: 100%; padding: 12px 44px 12px 18px;
      border-radius: var(--radius-full);
      border: 2px solid var(--border-primary);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    .search-input:focus {
      border-color: var(--accent-primary);
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search-btn {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      background: var(--accent-primary); border: none;
      color: white; width: 36px; height: 36px;
      border-radius: var(--radius-full); cursor: pointer;
    }
    .nav-actions { display: flex; gap: 8px; }
    .nav-btn {
      position: relative; background: transparent; border: none;
      color: var(--text-primary); width: 40px; height: 40px;
      border-radius: var(--radius-full); cursor: pointer;
      font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
    }
    .nav-btn .badge {
      position: absolute; top: -2px; right: -2px;
      background: var(--danger); color: white;
      font-size: 0.65rem; font-weight: bold;
      min-width: 18px; height: 18px;
      border-radius: var(--radius-full); display: flex;
      align-items: center; justify-content: center;
    }
    .theme-toggle { background: var(--bg-tertiary); border: 1px solid var(--border-primary); }
    .mobile-menu-btn {
      display: none; background: none; border: none;
      font-size: 1.5rem; color: var(--text-primary); cursor: pointer;
    }
    @media (max-width: 768px) {
      .mobile-menu-btn { display: block; }
      .navbar-inner { flex-wrap: nowrap; }
      .search-wrapper { order: 3; width: 100%; margin-top: 8px; }
    }
    /* Category Nav */
    .category-nav {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      overflow-x: auto; padding: 8px 0;
      position: sticky; top: 70px; z-index: 99;
    }
    .category-nav-inner {
      display: flex; gap: 8px; white-space: nowrap;
    }
    .cat-chip {
      padding: 8px 18px; border-radius: var(--radius-full);
      border: 1px solid var(--border-primary);
      background: var(--bg-tertiary);
      font-size: 0.85rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .cat-chip.active, .cat-chip:hover {
      background: var(--accent-primary); color: white;
      border-color: var(--accent-primary);
    }
    /* Hero */
    .hero-slider {
      background: var(--gradient-hero);
      border-radius: var(--radius-lg);
      margin: 24px 0; padding: 40px 50px;
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap;
      gap: 20px; color: white;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: 2.8rem; font-weight: 800; line-height: 1.2;
    }
    .hero-cta {
      margin-top: 20px; background: white;
      color: var(--accent-primary); padding: 12px 28px;
      border-radius: var(--radius-full); font-weight: bold;
      border: none; cursor: pointer;
    }
    .hero-image { font-size: 6rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-15px);} }
    /* Sections */
    .section-header {
      display: flex; justify-content: space-between;
      align-items: center; margin: 32px 0 20px;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: 1.8rem; font-weight: 700;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    @media (max-width: 600px) {
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    .product-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      overflow: hidden; transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    .product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
    .img-wrapper {
      position: relative; aspect-ratio: 1/1;
      background: var(--bg-tertiary);
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem;
    }
    .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .product-badge {
      position: absolute; top: 10px; left: 10px;
      background: var(--danger); color: white;
      padding: 4px 12px; border-radius: var(--radius-full);
      font-size: 0.7rem; font-weight: bold;
    }
    .wishlist-btn {
      position: absolute; top: 10px; right: 10px;
      background: rgba(255,255,255,0.8); border: none;
      width: 32px; height: 32px; border-radius: 50%;
      cursor: pointer; font-size: 1rem;
    }
    .product-info { padding: 14px; }
    .product-brand {
      font-size: 0.7rem; color: var(--text-tertiary);
      text-transform: uppercase;
    }
    .product-name { font-weight: 600; font-size: 0.9rem; margin: 6px 0; }
    .price-row {
      display: flex; gap: 8px; align-items: baseline;
      margin: 8px 0;
    }
    .current-price { font-weight: 700; font-size: 1.1rem; }
    .original-price {
      text-decoration: line-through; color: var(--text-tertiary);
      font-size: 0.8rem;
    }
    .discount { color: var(--success); font-weight: 600; }
    .cart-btn {
      width: 100%; padding: 10px;
      background: var(--accent-primary); border: none;
      color: white; font-weight: 600;
      border-radius: var(--radius-sm); cursor: pointer;
      transition: 0.2s;
    }
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }
    .category-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      padding: 20px; text-align: center;
      cursor: pointer;
    }
    .footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-primary);
      padding: 40px 0 20px;
      margin-top: 40px;
      text-align: center;
    }
    .mobile-bottom-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-primary);
      padding: 8px 0; justify-content: space-around;
      z-index: 100;
    }
    @media (max-width: 768px) {
      .mobile-bottom-nav { display: flex; }
      body { padding-bottom: 70px; }
    }
    .toast-container {
      position: fixed; top: 20px; right: 20px; z-index: 2000;
    }
    .toast {
      padding: 12px 20px; border-radius: 10px;
      color: white; margin-bottom: 8px;
      animation: slideIn 0.3s;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000; display: flex;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: 0.3s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      padding: 24px; width: 90%;
      max-width: 450px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <header class="top-navbar">
    <div class="container navbar-inner">
      <button class="mobile-menu-btn" onclick="openSidebar()">☰</button>
      <a href="#" class="logo-link">
        <div class="logo-icon">K</div>
        <span class="logo-text">KRAYVO</span>
      </a>
      <div class="search-wrapper">
        <input type="text" class="search-input" placeholder="Search products..." id="searchInput" oninput="liveSearch()">
        <button class="search-btn">🔍</button>
        <div id="searchSuggestions" style="position:absolute;top:100%;left:0;right:0;background:var(--bg-secondary);border-radius:12px;display:none;z-index:100;box-shadow:0 10px 25px rgba(0,0,0,0.1);"></div>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle nav-btn" onclick="toggleTheme()">🌙</button>
        <button class="nav-btn" onclick="openCartModal()">🛒<span class="badge" id="cartCount">0</span></button>
        <button class="nav-btn" id="authBtn" onclick="openAuthModal()">👤</button>
      </div>
    </div>
  </header>

  <nav class="category-nav">
    <div class="container category-nav-inner" id="categoryList"></div>
  </nav>

  <main class="container">
    <div class="hero-slider">
      <div>
        <h1 class="hero-title">Shop Smart,<br>Live Better</h1>
        <p>Up to 70% off on top brands</p>
        <button class="hero-cta" onclick="showToast('Welcome to KRAYVO!')">Shop Now →</button>
      </div>
      <div class="hero-image">🛍️</div>
    </div>

    <div class="section-header">
      <h2 class="section-title">✨ Featured Products</h2>
      <a href="admin.html" style="color:var(--accent-primary);">Admin Panel →</a>
    </div>
    <div class="product-grid" id="featuredGrid"></div>

    <div class="section-header">
      <h2 class="section-title">⚡ Flash Sale</h2>
    </div>
    <div class="product-grid" id="flashSaleGrid"></div>

    <div class="section-header">
      <h2 class="section-title">📂 Shop by Category</h2>
    </div>
    <div class="categories-grid" id="categoriesGrid"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 KRAYVO — Premium Marketplace | <a href="admin.html" style="color:var(--accent-primary);">Admin Panel</a></p>
    </div>
  </footer>

  <div class="mobile-bottom-nav">
    <a href="#" style="color:var(--accent-primary);">🏠 Home</a>
    <a href="#" onclick="openCartModal()">🛒 Cart</a>
    <a href="#" onclick="openAuthModal()">👤 Account</a>
  </div>

  <!-- Cart Modal -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal">
      <h3>Your Cart</h3>
      <div id="cartItems"></div>
      <div style="display:flex; justify-content:space-between; margin-top:16px;">
        <strong>Total: ₹<span id="cartTotal">0</span></strong>
        <button class="cart-btn" onclick="checkout()">Checkout</button>
      </div>
      <button onclick="closeCartModal()" style="margin-top:12px;">Close</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <h3>Login / Register</h3>
      <input type="email" id="authEmail" class="search-input" placeholder="Email" style="margin:8px 0;">
      <input type="password" id="authPassword" class="search-input" placeholder="Password">
      <button class="cart-btn" onclick="emailLogin()" style="margin-top:12px;">Login</button>
      <button class="cart-btn" style="background:transparent; border:1px solid var(--accent-primary);" onclick="emailSignup()">Create Account</button>
      <button class="cart-btn" style="background:#fff; color:#000;" onclick="googleLogin()">Google Sign In</button>
      <button onclick="closeAuthModal()">Close</button>
    </div>
  </div>

  <script>
    // Firebase Config (same as admin panel)
    const firebaseConfig = {
      apiKey: "AIzaSyAe2LRnVIUWhROFBevXemEJJMUzqLW0Azc",
      authDomain: "krayvo-131a8.firebaseapp.com",
      projectId: "krayvo-131a8",
      storageBucket: "krayvo-131a8.firebasestorage.app",
      messagingSenderId: "278539390638",
      appId: "1:278539390638:web:38cefde7899eb3c883a73f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentUser = null;
    let allProducts = [];
    let cart = JSON.parse(localStorage.getItem('krayvo_cart')) || [];
    let wishlist = JSON.parse(localStorage.getItem('krayvo_wishlist')) || [];

    function showToast(msg, type='info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast`;
      toast.style.background = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    function updateCartUI() {
      const count = cart.reduce((s,i)=>s+i.qty,0);
      document.getElementById('cartCount').innerText = count;
      localStorage.setItem('krayvo_cart', JSON.stringify(cart));
    }

    function addToCart(productId) {
      const existing = cart.find(i => i.id === productId);
      if(existing) existing.qty++;
      else cart.push({ id: productId, qty: 1 });
      updateCartUI();
      showToast('Added to cart!', 'success');
    }

    function openCartModal() { renderCartModal(); document.getElementById('cartModal').classList.add('open'); }
    function closeCartModal() { document.getElementById('cartModal').classList.remove('open'); }
    async function renderCartModal() {
      const container = document.getElementById('cartItems');
      let total = 0;
      if(cart.length === 0) { container.innerHTML = '<p>Cart empty</p>'; document.getElementById('cartTotal').innerText = '0'; return; }
      let productsMap = {};
      allProducts.forEach(p => productsMap[p.id] = p);
      container.innerHTML = cart.map(item => {
        const prod = productsMap[item.id];
        if(!prod) return '';
        total += prod.price * item.qty;
        return `<div style="display:flex; justify-content:space-between; margin:8px 0;"><span>${prod.name} x${item.qty} ₹${prod.price}</span><button onclick="removeFromCart('${item.id}')">Remove</button></div>`;
      }).join('');
      document.getElementById('cartTotal').innerText = total;
    }
    function removeFromCart(pid) {
      cart = cart.filter(i => i.id !== pid);
      updateCartUI();
      renderCartModal();
    }
    function checkout() {
      if(cart.length===0) return showToast('Cart empty','error');
      window.open('https://razorpay.me/@bibekpatrabooks', '_blank');
      cart = [];
      updateCartUI();
      closeCartModal();
      showToast('Redirected to payment','success');
    }

    function productCardHTML(p) {
      const discountPct = p.originalPrice ? Math.round((1 - p.price/p.originalPrice)*100) : 0;
      const isInWishlist = wishlist.includes(p.id);
      return `
        <div class="product-card" data-id="${p.id}" data-affiliate="${p.affiliateLink || ''}">
          <div class="img-wrapper">
            ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}">` : `<span style="font-size:3rem;">📦</span>`}
            ${discountPct > 0 ? `<span class="product-badge">-${discountPct}%</span>` : ''}
            <button class="wishlist-btn" onclick="event.stopPropagation();toggleWishlist('${p.id}', this)">${isInWishlist ? '❤️' : '🤍'}</button>
          </div>
          <div class="product-info">
            <div class="product-brand">${p.brand || 'Brand'}</div>
            <div class="product-name">${p.name}</div>
            <div class="price-row">
              <span class="current-price">₹${p.price}</span>
              ${p.originalPrice ? `<span class="original-price">₹${p.originalPrice}</span>` : ''}
              ${discountPct>0 ? `<span class="discount">${discountPct}% off</span>` : ''}
            </div>
            <button class="cart-btn" onclick="event.stopPropagation();addToCart('${p.id}')">Add to Cart</button>
            ${p.affiliateLink ? `<a href="${p.affiliateLink}" target="_blank" style="display:block; margin-top:6px; font-size:0.7rem; color:var(--accent-primary);">Buy via Affiliate →</a>` : ''}
          </div>
        </div>`;
    }

    function renderAllProductSections() {
      const featured = allProducts.slice(0, 8);
      const flash = allProducts.filter(p => (p.originalPrice && (p.originalPrice - p.price)/p.originalPrice >= 0.2)).slice(0, 4);
      document.getElementById('featuredGrid').innerHTML = featured.map(p => productCardHTML(p)).join('');
      document.getElementById('flashSaleGrid').innerHTML = flash.length ? flash.map(p=>productCardHTML(p)).join('') : '<p>No flash deals</p>';
      renderCategories();
    }

    function renderCategories() {
      const cats = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
      const grid = document.getElementById('categoriesGrid');
      if(!grid) return;
      grid.innerHTML = cats.slice(0,6).map(cat => `
        <div class="category-card" onclick="filterByCategory('${cat}')">
          <span style="font-size:2rem;">${cat === 'Electronics' ? '📱' : cat === 'Fashion' ? '👗' : cat === 'Home' ? '🏠' : '🛍️'}</span>
          <div>${cat}</div>
        </div>
      `).join('');
      const catNav = document.getElementById('categoryList');
      catNav.innerHTML = `<span class="cat-chip active" onclick="filterByCategory('all')">All</span>` + cats.map(cat => `<span class="cat-chip" onclick="filterByCategory('${cat}')">${cat}</span>`).join('');
    }

    function filterByCategory(cat) {
      if(cat === 'all') renderAllProductSections();
      else {
        const filtered = allProducts.filter(p => p.category === cat);
        document.getElementById('featuredGrid').innerHTML = filtered.map(p => productCardHTML(p)).join('');
        document.getElementById('flashSaleGrid').innerHTML = '';
      }
      showToast(`Showing ${cat}`, 'info');
    }

    function liveSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const sugBox = document.getElementById('searchSuggestions');
      if(query.length < 2) { sugBox.style.display = 'none'; return; }
      const matches = allProducts.filter(p => p.name.toLowerCase().includes(query) || p.brand?.toLowerCase().includes(query));
      sugBox.innerHTML = matches.slice(0,5).map(p => `<div style="padding:12px; cursor:pointer;" onclick="document.getElementById('searchInput').value='${p.name}'; sugBox.style.display='none'; filterByCategory('all');">${p.name} - ₹${p.price}</div>`).join('');
      sugBox.style.display = matches.length ? 'block' : 'none';
    }

    function toggleWishlist(pid, btn) {
      if(wishlist.includes(pid)) {
        wishlist = wishlist.filter(id => id !== pid);
        btn.textContent = '🤍';
        showToast('Removed from wishlist', 'info');
      } else {
        wishlist.push(pid);
        btn.textContent = '❤️';
        showToast('Added to wishlist', 'success');
      }
      localStorage.setItem('krayvo_wishlist', JSON.stringify(wishlist));
    }

    // Auth
    async function emailLogin() {
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        showToast('Logged in!', 'success');
        closeAuthModal();
      } catch(e) { showToast(e.message, 'error'); }
    }
    async function emailSignup() {
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection('users').doc(cred.user.uid).set({ email, role: 'customer', createdAt: new Date() });
        showToast('Account created', 'success');
        closeAuthModal();
      } catch(e) { showToast(e.message, 'error'); }
    }
    async function googleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const res = await auth.signInWithPopup(provider);
        const userDoc = await db.collection('users').doc(res.user.uid).get();
        if(!userDoc.exists) await db.collection('users').doc(res.user.uid).set({ email: res.user.email, role: 'customer' });
        showToast('Google signin', 'success');
        closeAuthModal();
      } catch(e) { showToast(e.message, 'error'); }
    }
    function openAuthModal() { document.getElementById('authModal').classList.add('open'); }
    function closeAuthModal() { document.getElementById('authModal').classList.remove('open'); }
    function openSidebar() { alert('Menu open - full sidebar can be built similarly'); }

    // Load products realtime
    function loadProductsRealtime() {
      db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
        allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderAllProductSections();
        updateCartUI();
      });
    }

    // Theme
    function toggleTheme() {
      const html = document.documentElement;
      const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    document.addEventListener('click', (e) => {
      const card = e.target.closest('.product-card');
      if(card && !e.target.closest('button') && !e.target.closest('a')) {
        const affiliate = card.dataset.affiliate;
        if(affiliate) window.open(affiliate, '_blank');
        else showToast('Product details', 'info');
      }
    });
    document.addEventListener('click', (e) => {
      if(!e.target.closest('.search-wrapper')) document.getElementById('searchSuggestions').style.display = 'none';
    });

    loadProductsRealtime();
    updateCartUI();
  </script>
</body>
</html>
