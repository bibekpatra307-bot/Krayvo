<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>KRAYVO | Discover Across Marketplaces</title>
  <meta name="description" content="Shop premium products from KRAYVO, Amazon, Flipkart, Myntra, and more. Compare prices, earn cashback, and get the best deals.">
  <meta property="og:title" content="KRAYVO — Multi‑Marketplace Discovery">
  <meta property="og:description" content="One platform, endless deals. Explore fashion, electronics, mobiles, beauty & more.">
  <meta property="og:image" content="https://yourdomain.com/images/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://yourdomain.com/">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <main class="container">
    <!-- Hero Section -->
    <section class="hero" style="text-align:center; padding:60px 0;">
      <h1 style="font-family:var(--font-display); font-size:3rem; margin-bottom:16px;">Discover the Best Deals Across Every Store</h1>
      <p style="color:var(--text-muted); max-width:600px; margin:0 auto 30px;">KRAYVO brings together KRAYVO Originals, Amazon, Flipkart, Myntra, and more – compare, save, and shop in one place.</p>
      <div class="search-wrapper" style="max-width:600px; margin:0 auto;">
        <input type="text" id="globalSearch" placeholder="Search products, brands, categories..." style="width:100%; padding:14px 24px; border-radius:60px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:1rem;" oninput="renderProducts()">
      </div>
      <div class="trending-searches" style="margin-top:20px;">
        <span>Trending: </span>
        <a href="#" onclick="setSearch('iPhone')">iPhone</a>, <a href="#" onclick="setSearch('Shoes')">Shoes</a>, <a href="#" onclick="setSearch('Saree')">Saree</a>
      </div>
    </section>

    <!-- Platform & Category Filters -->
    <div class="filters-section">
      <div class="platform-filters" id="platformFilters"></div>
      <div class="category-filters" id="categoryFilters"></div>
    </div>

    <!-- Products Grid -->
    <div class="products-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <h2 id="sectionTitle">KRAYVO · For You</h2>
      <span style="color:var(--text-muted);">Live prices · Instant updates</span>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </main>
  <div id="app-footer"></div>

  <script src="js/firebase.js"></script>
  <script src="js/script.js"></script>
  <script>
    // ---------- Data & State ----------
    const platformsList = [
      { key: 'krayvo', label: 'KRAYVO', icon: 'fas fa-crown', color: '#6366f1' },
      { key: 'amazon', label: 'Amazon', icon: 'fab fa-amazon', color: '#FF9900' },
      { key: 'flipkart', label: 'Flipkart', icon: 'fas fa-store', color: '#2874f0' },
      { key: 'myntra', label: 'Myntra', icon: 'fas fa-tshirt', color: '#e91e63' },
      { key: 'savana', label: 'Savana', icon: 'fas fa-leaf', color: '#2e7d32' },
      { key: 'ajio', label: 'Ajio', icon: 'fas fa-shopping-bag', color: '#f97316' },
      { key: 'meesho', label: 'Meesho', icon: 'fas fa-gem', color: '#f54d2e' }
    ];
    const categories = ["Mobile", "Fashion", "Beauty", "Electronics", "Home & Kitchen", "Accessories", "Books"];

    // Generate demo products (140+)
    const DEMO_PRODUCTS = [];
    const brands = {krayvo:'KRAYVO',amazon:'AmazonBasics',flipkart:'Flipkart SmartBuy',myntra:'Myntra',savana:'Savana',ajio:'Ajio',meesho:'Meesho'};
    platformsList.forEach(plat => {
      for(let i=1; i<=20; i++){
        const cat = categories[i % categories.length];
        const price = Math.floor(Math.random()*5000)+299;
        const origPrice = price + Math.floor(Math.random()*3000)+200;
        DEMO_PRODUCTS.push({
          id: `demo_${plat.key}_${i}`,
          name: `${brands[plat.key]} ${cat} ${i}`,
          brand: brands[plat.key],
          price, originalPrice: origPrice,
          category: cat,
          platform: plat.key,
          imageUrl: null,
          affiliateLink: plat.key === 'krayvo' ? '#' : `https://www.${plat.key}.com`,
          createdAt: new Date()
        });
      }
    });

    let allProducts = [...DEMO_PRODUCTS];
    let currentPlatform = 'krayvo';
    let currentCategory = 'For You';
    let searchQuery = '';

    // ---------- UI Functions ----------
    function getProductImage(p) {
      if(p.imageData) return p.imageData;
      if(p.imageUrl && p.imageUrl.trim()) return p.imageUrl;
      const emojis = {"Mobile":"📱","Fashion":"👕","Beauty":"💄","Electronics":"💻","Home & Kitchen":"🏠","Accessories":"⌚","Books":"📚"};
      return `https://placehold.co/400x400/1e293b/white?text=${emojis[p.category]||'📦'}`;
    }

    function renderProducts() {
      searchQuery = document.getElementById('globalSearch').value.toLowerCase().trim();
      let filtered = currentPlatform === 'krayvo'
        ? allProducts.filter(p => !p.platform || p.platform === 'krayvo')
        : allProducts.filter(p => p.platform === currentPlatform);
      if(searchQuery) filtered = filtered.filter(p => 
        p.name.toLowerCase().includes(searchQuery) || 
        (p.brand && p.brand.toLowerCase().includes(searchQuery)) || 
        p.category.toLowerCase().includes(searchQuery)
      );
      if(currentCategory !== 'For You') filtered = filtered.filter(p => p.category === currentCategory);
      else {
        const recent = [...filtered].sort((a,b)=>b.createdAt - a.createdAt).slice(0,12);
        const discounted = filtered.filter(p=>p.originalPrice && p.price<p.originalPrice).slice(0,8);
        filtered = [...recent, ...discounted].filter((v,i,a)=>a.findIndex(t=>t.id===v.id)===i);
      }
      const grid = document.getElementById('productGrid');
      if(!filtered.length) { grid.innerHTML='<div class="no-products">✨ No products found.</div>'; return; }
      grid.innerHTML = filtered.map(p => {
        const img = getProductImage(p);
        const discount = p.originalPrice ? Math.round((1-p.price/p.originalPrice)*100) : 0;
        const plat = platformsList.find(pl=>pl.key===p.platform) || platformsList[0];
        return `<div class="card product-card">
          <div class="product-img">
            <a href="product.html?id=${p.id}"><img src="${img}" alt="${p.name}" loading="lazy"></a>
            <span class="platform-badge"><i class="${plat.icon}"></i> ${plat.label}</span>
            <button class="wishlist-btn" onclick="toggleWishlist('${p.id}')"><i class="far fa-heart"></i></button>
          </div>
          <div class="product-info">
            <div class="brand">${p.brand || plat.label}</div>
            <h3 class="name"><a href="product.html?id=${p.id}">${p.name}</a></h3>
            <div class="price-row">
              ${p.originalPrice ? `<span class="old-price">₹${p.originalPrice}</span>` : ''}
              <span class="price">₹${p.price}</span>
              ${discount>0 ? `<span class="discount">${discount}% OFF</span>` : ''}
            </div>
            <a href="product.html?id=${p.id}" class="btn btn-primary btn-sm">View Deal</a>
          </div>
        </div>`;
      }).join('');
    }

    function renderFilters() {
      const platContainer = document.getElementById('platformFilters');
      platContainer.innerHTML = platformsList.map(p => 
        `<button class="filter-btn ${currentPlatform===p.key?'active':''}" onclick="switchPlatform('${p.key}')"><i class="${p.icon}"></i> ${p.label}</button>`
      ).join('');
      const catContainer = document.getElementById('categoryFilters');
      const allCats = ['For You', ...categories];
      catContainer.innerHTML = allCats.map(c => 
        `<button class="filter-btn ${currentCategory===c?'active':''}" onclick="switchCategory('${c}')">${c}</button>`
      ).join('');
    }

    window.switchPlatform = (key) => { currentPlatform = key; currentCategory = 'For You'; renderFilters(); renderProducts(); };
    window.switchCategory = (cat) => { currentCategory = cat; renderFilters(); renderProducts(); };
    window.toggleWishlist = (pid) => { /* wishlist logic */ };
    window.setSearch = (term) => { document.getElementById('globalSearch').value = term; renderProducts(); };

    // Firestore sync (background)
    db.collection('products').get().then(snap => {
      if(!snap.empty){
        const firestore = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const merged = [...DEMO_PRODUCTS];
        firestore.forEach(fp => {
          const idx = merged.findIndex(m=>m.id===fp.id);
          if(idx!==-1) merged[idx] = fp;
          else merged.push(fp);
        });
        allProducts = merged;
        renderProducts();
      }
    }).catch(()=>{});

    // Init
    renderFilters();
    renderProducts();
  </script>
</body>
</html>
