<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>KRAYVO | Shop Smart, Live Better</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Playfair Display', serif;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
      --radius: 16px;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      line-height: 1.5;
      min-height: 100vh;
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
    /* Navbar */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 12px 0;
    }
    .nav-inner {
      display: flex; align-items: center; gap: 20px;
      flex-wrap: wrap;
    }
    .logo {
      font-family: var(--font-display);
      font-size: 1.8rem; font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }
    .search-bar {
      flex: 1; max-width: 400px; position: relative;
    }
    .search-bar input {
      width: 100%; padding: 10px 16px;
      border-radius: 40px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text);
    }
    .nav-icons {
      display: flex; gap: 12px;
    }
    .nav-icons button {
      background: none; border: none;
      font-size: 1.2rem; cursor: pointer;
      color: var(--text); position: relative;
    }
    .badge {
      position: absolute; top: -6px; right: -8px;
      background: var(--danger); color: white;
      font-size: 0.65rem; border-radius: 20px;
      padding: 2px 6px; min-width: 18px;
    }
    .theme-toggle {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 40px; width: 36px; height: 36px;
    }
    /* Hero */
    .hero {
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: var(--radius);
      padding: 40px 50px;
      margin: 30px 0;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .hero h1 { font-size: 2.5rem; font-family: var(--font-display); }
    .hero-cta {
      background: white; color: var(--primary);
      border: none; padding: 12px 28px;
      border-radius: 40px; font-weight: 600;
      margin-top: 16px; cursor: pointer;
    }
    /* Products */
    .section-header {
      display: flex; justify-content: space-between;
      align-items: center; margin: 32px 0 20px;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: 1.6rem; font-weight: 700;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    @media (max-width: 640px) {
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }
    .product-img {
      aspect-ratio: 1/1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    .product-img img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .product-info {
      padding: 12px;
    }
    .product-brand {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .product-name {
      font-weight: 600;
      margin: 6px 0;
    }
    .price {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .old-price {
      text-decoration: line-through;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-left: 6px;
    }
    .cart-btn {
      width: 100%;
      margin-top: 10px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
    }
    /* Footer */
    .footer {
      text-align: center;
      padding: 30px 0;
      margin-top: 40px;
      border-top: 1px solid var(--border);
    }
    /* Modal */
    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      opacity: 0; pointer-events: none;
      transition: 0.2s;
    }
    .modal.open {
      opacity: 1; pointer-events: all;
    }
    .modal-content {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      width: 90%; max-width: 450px;
    }
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--text); color: white;
      padding: 12px 20px;
      border-radius: 40px;
      z-index: 1100;
    }
    .mobile-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 8px 0;
      justify-content: space-around;
      z-index: 99;
    }
    @media (max-width: 768px) {
      .mobile-nav { display: flex; }
      body { padding-bottom: 70px; }
      .hero { padding: 30px 20px; }
      .hero h1 { font-size: 1.8rem; }
    }
    .admin-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="navbar">
  <div class="container nav-inner">
    <a href="#" class="logo">KRAYVO</a>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search products..." oninput="liveSearch()">
    </div>
    <div class="nav-icons">
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      <button onclick="openCart()">🛒<span class="badge" id="cartCount">0</span></button>
      <button onclick="openAuth()">👤</button>
    </div>
  </div>
</div>

<main class="container">
  <div class="hero">
    <div>
      <h1>Shop Smart,<br>Live Better</h1>
      <p>Up to 70% off on top brands</p>
      <button class="hero-cta" onclick="showToast('Welcome to KRAYVO!')">Shop Now →</button>
    </div>
    <div style="font-size: 5rem;">🛍️</div>
  </div>

  <div class="section-header">
    <h2 class="section-title">✨ Featured Products</h2>
    <a href="#" class="admin-link" id="adminLink" target="_blank">Admin Panel →</a>
  </div>
  <div class="product-grid" id="productGrid"></div>
</main>

<footer class="footer">
  <div class="container">
    <p>© 2026 KRAYVO — Premium Marketplace</p>
  </div>
</footer>

<div class="mobile-nav">
  <a href="#" onclick="openCart()">🛒 Cart</a>
  <a href="#" onclick="openAuth()">👤 Account</a>
</div>

<!-- Cart Modal -->
<div id="cartModal" class="modal">
  <div class="modal-content">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>
    <div style="margin-top:16px; display:flex; justify-content:space-between;">
      <strong>Total: ₹<span id="cartTotal">0</span></strong>
      <button class="cart-btn" style="width:auto; padding:8px 16px;" onclick="checkout()">Checkout</button>
    </div>
    <button onclick="closeCart()" style="margin-top:12px;">Close</button>
  </div>
</div>

<!-- Auth Modal -->
<div id="authModal" class="modal">
  <div class="modal-content">
    <h3>Login / Register</h3>
    <input type="email" id="authEmail" placeholder="Email" style="width:100%; margin:8px 0; padding:10px;">
    <input type="password" id="authPassword" placeholder="Password" style="width:100%; margin:8px 0; padding:10px;">
    <button class="cart-btn" onclick="emailLogin()">Login</button>
    <button class="cart-btn" style="background:transparent; color:var(--primary);" onclick="emailSignup()">Create Account</button>
    <button class="cart-btn" style="background:#fff; color:#000;" onclick="googleLogin()">Sign in with Google</button>
    <button onclick="closeAuth()">Close</button>
  </div>
</div>

<script>
  // Firebase Config (same as admin panel)
  const firebaseConfig = {
    apiKey: "AIzaSyAe2LRnVIUWhROFBevXemEJJMUzqLW0Azc",
    authDomain: "krayvo-131a8.firebaseapp.com",
    projectId: "krayvo-131a8",
    storageBucket: "krayvo-131a8.firebasestorage.app",
    messagingSenderId: "278539390638",
    appId: "1:278539390638:web:38cefde7899eb3c883a73f"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let allProducts = [];
  let cart = JSON.parse(localStorage.getItem('krayvo_cart')) || [];
  let currentUser = null;

  function updateCartUI() {
    const count = cart.reduce((s,i)=>s+i.qty,0);
    document.getElementById('cartCount').innerText = count;
    localStorage.setItem('krayvo_cart', JSON.stringify(cart));
  }

  function addToCart(pid) {
    const existing = cart.find(i => i.id === pid);
    if(existing) existing.qty++;
    else cart.push({ id: pid, qty: 1 });
    updateCartUI();
    showToast('Added to cart');
  }

  function removeFromCart(pid) {
    cart = cart.filter(i => i.id !== pid);
    updateCartUI();
    renderCart();
  }

  async function renderCart() {
    const container = document.getElementById('cartItems');
    if(cart.length===0) { container.innerHTML='<p>Cart empty</p>'; document.getElementById('cartTotal').innerText='0'; return; }
    let total=0;
    const prodMap = {};
    allProducts.forEach(p=>prodMap[p.id]=p);
    container.innerHTML = cart.map(item=>{
      const p = prodMap[item.id];
      if(!p) return '';
      total += p.price * item.qty;
      return `<div style="display:flex; justify-content:space-between; margin:8px 0;">
        <span>${p.name} x${item.qty} ₹${p.price}</span>
        <button onclick="removeFromCart('${item.id}')">Remove</button>
      </div>`;
    }).join('');
    document.getElementById('cartTotal').innerText = total;
  }

  function checkout() {
    if(cart.length===0) return showToast('Cart empty','error');
    window.open('https://razorpay.me/@bibekpatrabooks', '_blank');
    cart = [];
    updateCartUI();
    closeCart();
    showToast('Redirecting to payment');
  }

  function productCard(p) {
    const discount = p.originalPrice ? Math.round((1-p.price/p.originalPrice)*100) : 0;
    return `
      <div class="product-card">
        <div class="product-img">
          ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}">` : '📦'}
        </div>
        <div class="product-info">
          <div class="product-brand">${p.brand || 'Brand'}</div>
          <div class="product-name">${p.name}</div>
          <div><span class="price">₹${p.price}</span>${p.originalPrice ? `<span class="old-price">₹${p.originalPrice}</span>` : ''} ${discount>0 ? `<span style="color:var(--success);">-${discount}%</span>`:''}</div>
          <button class="cart-btn" onclick="addToCart('${p.id}')">Add to Cart</button>
          ${p.affiliateLink ? `<a href="${p.affiliateLink}" target="_blank" style="display:block; font-size:0.7rem; margin-top:6px;">Affiliate Link →</a>` : ''}
        </div>
      </div>
    `;
  }

  function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = allProducts.slice(0,12).map(p=>productCard(p)).join('');
  }

  function liveSearch() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    if(q.length<2) return renderProducts();
    const filtered = allProducts.filter(p=>p.name.toLowerCase().includes(q) || (p.brand && p.brand.toLowerCase().includes(q)));
    document.getElementById('productGrid').innerHTML = filtered.slice(0,12).map(p=>productCard(p)).join('');
  }

  // Real-time products
  db.collection('products').orderBy('createdAt','desc').onSnapshot(snap=>{
    allProducts = snap.docs.map(doc=>({id:doc.id, ...doc.data()}));
    renderProducts();
  });

  // Auth functions
  async function emailLogin() {
    const email = document.getElementById('authEmail').value;
    const pass = document.getElementById('authPassword').value;
    try {
      await auth.signInWithEmailAndPassword(email,pass);
      showToast('Logged in');
      closeAuth();
    } catch(e){ showToast(e.message,'error'); }
  }
  async function emailSignup() {
    const email = document.getElementById('authEmail').value;
    const pass = document.getElementById('authPassword').value;
    try {
      await auth.createUserWithEmailAndPassword(email,pass);
      showToast('Account created');
      closeAuth();
    } catch(e){ showToast(e.message,'error'); }
  }
  async function googleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await auth.signInWithPopup(provider);
      showToast('Google signin');
      closeAuth();
    } catch(e){ showToast(e.message,'error'); }
  }
  function openAuth() { document.getElementById('authModal').classList.add('open'); }
  function closeAuth() { document.getElementById('authModal').classList.remove('open'); }
  function openCart() { renderCart(); document.getElementById('cartModal').classList.add('open'); }
  function closeCart() { document.getElementById('cartModal').classList.remove('open'); }

  function showToast(msg, type='success') {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerText = msg;
    t.style.background = type==='error'?'#ef4444':'#10b981';
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),2500);
  }

  function toggleTheme() {
    const html = document.documentElement;
    const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
  }
  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateCartUI();

  // Update admin link after hosting - aapko yahan apna admin panel ka URL daalna hai
  // Jaise: https://your-username.github.io/admin-repo/admin.html
  // Abhi placeholder hai, baad mein change kar dena
  document.getElementById('adminLink').href = "https://your-admin-panel-link.com/admin.html";
</script>
</body>
</html>
