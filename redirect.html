<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Opening Official Store... | KRAYVO</title>
  <meta name="description" content="You are being redirected to the official store within KRAYVO.">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { margin: 0; padding: 0; }
    .iframe-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg);
    }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--border);
      position: relative; z-index: 10;
    }
    .top-bar .logo { font-family: var(--font-display); font-weight: 700; color: var(--primary); text-decoration: none; font-size: 1.2rem; }
    .top-bar .actions { display: flex; gap: 8px; }
    .top-bar .btn-sm { padding: 4px 12px; font-size: 0.8rem; }
    .iframe-wrapper {
      position: absolute; top: 50px; left: 0; right: 0; bottom: 0;
      background: white;
    }
    .iframe-wrapper iframe {
      width: 100%; height: 100%; border: none;
    }
    .fallback-message {
      display: none; position: absolute; top: 50px; left: 0; right: 0; bottom: 0;
      background: var(--card); flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center;
    }
    .fallback-message.active { display: flex; }
  </style>
</head>
<body>
  <div class="iframe-container">
    <div class="top-bar">
      <a href="index.html" class="logo">← KRAYVO</a>
      <div class="actions">
        <button class="btn btn-outline btn-sm" onclick="openInNewTab()">🔗 Open in New Tab</button>
      </div>
    </div>
    <div class="iframe-wrapper" id="iframeWrapper">
      <iframe id="officialFrame" src="" title="Official Store"></iframe>
    </div>
    <div class="fallback-message" id="fallbackMessage">
      <h3>⚠️ Store cannot be displayed here</h3>
      <p style="color:var(--text-muted);">Some websites don't allow embedding. Please use the button below.</p>
      <button class="btn btn-primary" onclick="openInNewTab()">Open in New Tab</button>
    </div>
  </div>

  <script>
    // Platform → official URL mapping (add new platforms easily)
    const platformUrls = {
      amazon: "https://www.amazon.in",
      flipkart: "https://www.flipkart.com",
      myntra: "https://www.myntra.com",
      ajio: "https://www.ajio.com",
      savana: "https://www.savana.com",
      meesho: "https://www.meesho.com"
    };

    // Get platform from URL
    const params = new URLSearchParams(window.location.search);
    const platform = params.get('platform');
    const url = platformUrls[platform] || platformUrls.amazon;

    const iframe = document.getElementById('officialFrame');
    iframe.src = url;

    // Attempt to detect if iframe load was blocked (after 5 seconds)
    let loadDetected = false;
    iframe.addEventListener('load', () => {
      loadDetected = true;
      // Even if load fires, cross-origin iframe might be empty if blocked (like blank page). We'll give a few seconds.
    });

    setTimeout(() => {
      // If no load event or iframe still on same location? Hard to detect. We'll just show the fallback if the iframe is still empty visually? Not possible reliably. We'll keep the button always visible. 
      // Instead, we'll show a small hint after 8 seconds if the user hasn't interacted.
      const fallback = document.getElementById('fallbackMessage');
      // We'll only show fallback if iframe hasn't loaded content? We'll check if iframe.contentDocument is null? Not allowed. So we simply keep the "Open in New Tab" button prominent.
      // The fallback message will appear if the iframe fails to load due to error.
    }, 8000);

    iframe.addEventListener('error', () => {
      document.getElementById('fallbackMessage').classList.add('active');
    });

    function openInNewTab() {
      window.open(url, '_blank', 'noopener');
    }
  </script>
</body>
</html>
